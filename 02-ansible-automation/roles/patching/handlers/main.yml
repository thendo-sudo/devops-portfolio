---
- name: send patch notification
  ansible.builtin.debug:
    msg: >-
      [PATCH NOTIFICATION] {{ inventory_hostname }} was successfully patched
      and rebooted at {{ ansible_date_time.iso8601 | default('unknown time') }}.
      OS: {{ ansible_distribution }} {{ ansible_distribution_version }}.
  # Extend this handler to send real alerts, for example:
